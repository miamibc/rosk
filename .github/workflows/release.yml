# Tests on every push; on main also builds the source archive (like picco's release flow).
name: release

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Test
        run: python -m pytest -q tests

  dist:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: rosk-source
          path: dist/*.tar.gz
