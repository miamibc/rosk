# Runs when a pull request is merged into master, or by hand (Actions -> release -> Run workflow).
# Pushes to branches and to master do not start it.
# 1. test:    the same `make check` as before a commit.
# 2. release: tags v<version> from rosk/__init__.py and publishes a GitHub release with the
#             source archive. A version that is already released is never rebuilt: bump
#             __version__ for a new release.
name: release

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
    # Rosk runs on the system PyGObject (a PyPI build would need the GLib headers),
    # so the venv is made like `make venv` does it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            python3-gi python3-venv gir1.2-glib-2.0 libglib2.0-bin gettext
      - name: Venv
        run: make venv PYTHON=/usr/bin/python3
      - name: Check
        run: make check

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - name: Version
        id: version
        run: |
          version=$(python3 -c "import rosk; print(rosk.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::notice::v$version is already released; bump __version__ in rosk/__init__.py for a new release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Archive
        if: steps.version.outputs.exists != 'true'
        run: make dist
      - name: Publish
        if: steps.version.outputs.exists != 'true'
        run: |
          v=${{ steps.version.outputs.version }}
          gh release create "v$v" "dist/rosk-$v.tar.gz" \
            --target "$SHA" --title "Rosk $v" --generate-notes
