# Tests on every push; on the default branch also builds the source archive (like picco's release flow).
name: release

on:
  push:
  workflow_dispatch:

jobs:
  test:
    # The same checks as `make check` before a commit. Rosk runs on the system PyGObject
    # (a PyPI build would need the GLib headers), so the venv is made like `make venv` does it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            python3-gi python3-venv gir1.2-glib-2.0 libglib2.0-bin gettext
      - name: Venv
        run: make venv PYTHON=/usr/bin/python3
      - name: Check
        run: make check

  dist:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: rosk-source
          path: dist/*.tar.gz
